# Inventar fuer Semaphore (Inventory-Typ "File" -> inventory.yml im Repo)
# Neue Server: unter "lxc" eintragen, dann laufen sie automatisch im Update-Job mit.
all:
  children:

    # Server, die der woechentliche Update-Job (updatehosts.yml) aktualisiert
    updates:
      children:
        lxc:
        semaphore_host:

    # LXC-Container auf dommox, Zugriff als "ansible" mit sudo
    lxc:
      vars:
        ansible_user: ansible
      hosts:
        mediaserver:          # LXC 103 - Docker-Host (/root/services)
          ansible_host: 192.168.0.150
        nextcloud:            # LXC 104 - NextcloudPi
          ansible_host: 192.168.0.50
        adguard:              # LXC 105
          ansible_host: 192.168.0.77
        nginxproxymanager:    # LXC 106
          ansible_host: 192.168.0.133
        meinewebsite:         # LXC 107 - Website + cloudflared
          ansible_host: 192.168.0.99
        qbittorrent:          # LXC 112
          ansible_host: 192.168.0.164
        videogen:             # LXC 114 - Video-Generator, Output auf NAS (/mnt/videos)
          ansible_host: 192.168.0.41
        pbs:                  # LXC 113 - Proxmox Backup Server (kein ansible-User, Zugriff als root)
          ansible_host: 192.168.0.40
          ansible_user: root

    # LXC 102 - hier laeuft Semaphore selbst, daher lokale Verbindung
    semaphore_host:
      hosts:
        ansible:
          ansible_host: 192.168.0.231
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3

    # Proxmox-Host: bewusst NICHT im automatischen Update-Job
    # (Upgrade/Neustart betrifft alle Container und die HAOS-VM).
    # Semaphore hat hier aktuell keinen SSH-Zugang.
    proxmox:
      vars:
        ansible_user: root
      hosts:
        dommox:
          ansible_host: 192.168.0.123
