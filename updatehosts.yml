---
# Woechentliches Paket-Update aller Server aus der Gruppe "updates" (siehe inventory.yml).
# Es wird NICHT automatisch neu gestartet - ob ein Neustart noetig ist, steht im Bericht.
- name: Update und Upgrade aller Hosts
  hosts: updates
  become: true
  gather_facts: false

  tasks:
    - name: Aktualisiere den Paket-Cache (apt update)
      apt:
        update_cache: yes
        cache_valid_time: 3600  # Cache für 1 Stunde gültig halten

    - name: Führe ein Upgrade aller Pakete durch (apt full-upgrade)
      apt:
        upgrade: full
      register: upgrade

    - name: Entferne unbenutzte Abhängigkeiten (apt autoremove)
      apt:
        autoremove: yes

    - name: Leere den Paket-Cache (apt autoclean)
      apt:
        autoclean: yes

    - name: Prüfe ob ein Neustart nötig ist
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Prüfe den freien Festplattenspeicher
      command: df -h --output=pcent,avail /
      register: disk_space
      changed_when: false
      check_mode: false

    - name: Bericht
      debug:
        msg: >-
          {{ upgrade.stdout | default('') | regex_findall('(?m)^Setting up (\S+)') | length }} Pakete aktualisiert,
          Disk belegt/frei: {{ disk_space.stdout_lines[-1] | trim }},
          {{ 'NEUSTART NÖTIG' if reboot_required.stat.exists else 'kein Neustart nötig' }}

    - name: Aktualisierte Pakete
      debug:
        msg: "{{ upgrade.stdout | default('') | regex_findall('(?m)^Setting up (\\S+)') }}"
      when: upgrade.changed

    - name: Warnung bei fast voller Festplatte (löst Benachrichtigung aus)
      fail:
        msg: "Festplatte zu {{ disk_space.stdout_lines[-1].split()[0] }} belegt - bitte aufräumen"
      when: disk_space.stdout_lines[-1].split()[0] | replace('%', '') | int > 90
